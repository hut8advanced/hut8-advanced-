
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HUT8 ADVANCED Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#F3FAFF;color:#12345A}
button,input{font:inherit}
.app{display:flex;min-height:100vh}
.sidebar{width:235px;background:#279FD5;color:white;padding:25px 15px;position:fixed;inset:0 auto 0 0;overflow-y:auto}
.brand{font-size:22px;font-weight:800;margin:5px 10px 30px}
.nav button{display:block;width:100%;border:0;background:transparent;color:white;text-align:left;padding:14px 13px;border-radius:9px;margin:5px 0;cursor:pointer;font-size:15px}
.nav button:hover,.nav button.active{background:rgba(255,255,255,.2)}
.main{margin-left:235px;width:calc(100% - 235px);padding:25px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:25px}
.topbar h1{font-size:24px}
.small{color:#66819a;font-size:13px;margin-top:5px}
.user-tag{background:white;border:1px solid #d9edf8;border-radius:20px;padding:10px 14px;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:22px}
.card,.panel{background:white;border:1px solid #dceef8;border-radius:14px;padding:20px;box-shadow:0 4px 15px rgba(24,91,130,.04)}
.card p{font-size:13px;color:#66819a;margin-bottom:12px}
.card h2{font-size:25px;overflow-wrap:anywhere}
.section-title{font-size:19px;margin:25px 0 14px}
.actions{display:flex;gap:12px;flex-wrap:wrap}
.primary,.secondary,.danger{border:0;border-radius:9px;padding:12px 17px;cursor:pointer;font-weight:700}
.primary{background:#279FD5;color:white}
.secondary{background:#e7f5fc;color:#17658e}
.danger{background:#fff0f0;color:#b42318}
.panel{margin-bottom:18px}
.panel h3{margin-bottom:15px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
.field input{width:100%;padding:12px;border:1px solid #cfe2ee;border-radius:8px;outline:none;background:#fff;color:#12345A}
.field input:focus{border-color:#279FD5}
.full{grid-column:1/-1}
.notice{padding:12px;border-radius:8px;background:#edf8ff;color:#17658e;margin:12px 0;font-size:13px}
.message{margin-top:12px;font-size:14px}
.record{padding:13px 0;border-bottom:1px solid #edf2f6}
.record:last-child{border-bottom:0}
.record small{color:#66819a}
.record p{margin-top:5px;overflow-wrap:anywhere}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:500px}
th,td{text-align:left;padding:12px;border-bottom:1px solid #edf2f6;font-size:13px}
th{color:#66819a;background:#f7fbfe}
.empty{padding:22px;text-align:center;color:#66819a}
.mobile-nav{display:none}
.hidden{display:none!important}
@media(max-width:800px){
 .sidebar{display:none}
 .main{margin-left:0;width:100%;padding:17px 14px 90px}
 .cards{grid-template-columns:1fr 1fr}
 .topbar h1{font-size:20px}
 .mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #dceef8;justify-content:space-around;padding:8px 2px;z-index:10}
 .mobile-nav button{border:0;background:transparent;color:#17658e;font-size:11px;padding:7px 4px}
 .form-grid{grid-template-columns:1fr}
 .full{grid-column:auto}
}
@media(max-width:400px){.cards{grid-template-columns:1fr}}
</style>
</head>

<body>
<div class="app">

<aside class="sidebar">
  <div class="brand">HUT8 ADVANCED</div>
  <nav class="nav">
    <button class="active" onclick="openPage('home',this)">⌂ Home</button>
    <button onclick="openPage('deposit',this)">＋ Deposit</button>
    <button onclick="openPage('withdraw',this)">↗ Withdraw</button>
    <button onclick="openPage('plans',this)">▣ Investment Plans</button>
    <button onclick="openPage('earnings',this)">◷ My Earnings</button>
    <button onclick="openPage('transactions',this)">▤ Transactions</button>
    <button onclick="openPage('referrals',this)">♧ Referrals</button>
    <button onclick="openPage('profile',this)">⚙ My Profile</button>
    <button onclick="logout()">↪ Logout</button>
  </nav>
</aside>

<main class="main">
  <div class="topbar">
    <div>
      <h1 id="pageTitle">Dashboard</h1>
      <p class="small" id="welcome">Welcome to your account</p>
    </div>
    <div class="user-tag" id="userTag">My Account</div>
  </div>

  <div id="content">
    <div class="cards">
      <div class="card"><p>Account Balance</p><h2 id="balanceValue">Loading...</h2></div>
      <div class="card"><p>Total Deposited</p><h2 id="depositValue">Loading...</h2></div>
      <div class="card"><p>Total Withdrawn</p><h2 id="withdrawValue">Loading...</h2></div>
    </div>
    <div class="panel">
      <h3>Welcome to HUT8 ADVANCED</h3>
      <p class="small">Manage your account, view your records and submit your requests.</p>
      <div class="actions" style="margin-top:18px">
        <button class="primary" onclick="openPage('deposit')">Make a Deposit</button>
        <button class="secondary" onclick="openPage('plans')">View Plans</button>
        <button class="secondary" onclick="openPage('withdraw')">Request Withdrawal</button>
      </div>
    </div>
  </div>
</main>
</div>

<div class="mobile-nav">
  <button onclick="openPage('home')">⌂<br>Home</button>
  <button onclick="openPage('deposit')">＋<br>Deposit</button>
  <button onclick="openPage('withdraw')">↗<br>Withdraw</button>
  <button onclick="openPage('plans')">▣<br>Plans</button>
  <button onclick="openPage('profile')">⚙<br>Profile</button>
</div>

<script>
const SUPABASE_URL = "https://chjtxxwxhvjwpspmikme.supabase.co";
const SUPABASE_KEY = "sb_publishable_g8gM0qRrMveb8A7H3BLYYg_g21-SBKA";

const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let currentUser = null;
let profile = null;

const content = document.getElementById("content");

function money(value){
  return Number(value || 0).toLocaleString("en-US",{maximumFractionDigits:2});
}

function esc(value){
  return String(value ?? "").replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

function showMessage(id,message,isError=false){
  const el=document.getElementById(id);
  if(el){
    el.textContent=message;
    el.style.color=isError?"#b42318":"#16804a";
  }
}

async function startDashboard(){
  const {data,error}=await db.auth.getSession();

  if(error || !data.session){
    window.location.href="index.html";
    return;
  }

  currentUser=data.session.user;
  await loadProfile();
  await showHome();
}

async function loadProfile(){
  const {data,error}=await db
    .from("hut8_profiles")
    .select("*")
    .eq("id",currentUser.id)
    .maybeSingle();

  if(error){
    console.error("Profile loading error:",error);
    profile={};
  }else{
    profile=data || {};
  }

  profile.email=currentUser.email || profile.email || "";

  document.getElementById("userTag").textContent=
    profile.username || profile.full_name || "My Account";

  document.getElementById("welcome").textContent=
    "Welcome, "+(profile.full_name || profile.username || "User");
}

async function refreshSummary(){
  const balance=profile?.balance || 0;
  document.getElementById("balanceValue").textContent=money(balance);

  const {data,error}=await db
    .from("hut8_transactions")
    .select("transaction_type,direction,amount,status")
    .eq("user_id",currentUser.id);

  if(error){
    console.error("Summary error:",error);
    document.getElementById("depositValue").textContent="—";
    document.getElementById("withdrawValue").textContent="—";
    return;
  }

  let deposits=0,withdrawals=0;

  (data || []).forEach(t=>{
    if(t.status!=="completed") return;
    const amount=Number(t.amount || 0);

    if(t.transaction_type==="deposit" && t.direction==="credit"){
      deposits+=amount;
    }
    if(t.transaction_type==="withdrawal" && t.direction==="debit"){
      withdrawals+=amount;
    }
  });

  document.getElementById("depositValue").textContent=money(deposits);
  document.getElementById("withdrawValue").textContent=money(withdrawals);
}

async function showHome(){
  document.getElementById("pageTitle").textContent="Dashboard";

  content.innerHTML=`
    <div class="cards">
      <div class="card"><p>Account Balance</p><h2 id="balanceValue">0</h2></div>
      <div class="card"><p>Total Deposited</p><h2 id="depositValue">0</h2></div>
      <div class="card"><p>Total Withdrawn</p><h2 id="withdrawValue">0</h2></div>
    </div>
    <div class="panel">
      <h3>Welcome to HUT8 ADVANCED</h3>
      <p class="small">Manage your account, view your records and submit your requests.</p>
      <div class="actions" style="margin-top:18px">
        <button class="primary" onclick="openPage('deposit')">Make a Deposit</button>
        <button class="secondary" onclick="openPage('plans')">View Plans</button>
        <button class="secondary" onclick="openPage('withdraw')">Request Withdrawal</button>
      </div>
    </div>`;

  await refreshSummary();
}

function openPage(page,button){
  document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
  if(button) button.classList.add("active");

  if(page==="home"){showHome();return;}
  if(page==="profile"){showProfile();return;}
  if(page==="earnings"){showEarnings();return;}
  if(page==="transactions"){showTransactions();return;}
  if(page==="referrals"){showReferrals();return;}

  const pages={
    deposit:"deposit.html",
    withdraw:"withdraw.html",
    plans:"plans.html"
  };

  if(pages[page]){
    window.location.href=pages[page];
  }
}

function showProfile(){
  document.getElementById("pageTitle").textContent="My Profile";

  const p=profile || {};

  content.innerHTML=`
    <div class="panel">
      <h3>Edit Your Profile</h3>
      <p class="small">Update your personal account information below.</p>

      <form id="profileForm" onsubmit="saveProfile(event)">
        <div class="form-grid">
          <div class="field">
            <label>Full Name</label>
            <input id="editFullName" type="text" maxlength="100"
              value="${esc(p.full_name || "")}" required>
          </div>

          <div class="field">
            <label>Username</label>
            <input id="editUsername" type="text" maxlength="50"
              value="${esc(p.username || "")}" required>
          </div>

          <div class="field">
            <label>Mobile Number</label>
            <input id="editMobile" type="tel" maxlength="30"
              value="${esc(p.mobile || "")}" required>
          </div>

          <div class="field">
            <label>Email Address</label>
            <input id="editEmail" type="email" maxlength="254"
              value="${esc(currentUser.email || "")}" required>
          </div>

          <div class="field full">
            <label>New Password (leave blank to keep your current password)</label>
            <input id="editPassword" type="password" minlength="6"
              autocomplete="new-password" placeholder="Enter a new password">
          </div>

          <div class="full">
            <button class="primary" id="saveProfileButton" type="submit">
              Save Profile Changes
            </button>
            <p class="message" id="profileMessage"></p>
          </div>
        </div>
      </form>
    </div>

    <div class="panel">
      <h3>Account Information</h3>
      <div class="record"><small>Account Balance</small><p>${money(p.balance)}</p></div>
      <div class="record"><small>Referral Code</small><p>${esc(p.referral_code || "Not available")}</p></div>
      <div class="notice">Your balance and referral code are protected account records and cannot be changed from this profile form.</div>
    </div>`;
}

async function saveProfile(event){
  event.preventDefault();

  const button=document.getElementById("saveProfileButton");
  button.disabled=true;
  button.textContent="Saving...";

  const full_name=document.getElementById("editFullName").value.trim();
  const username=document.getElementById("editUsername").value.trim();
  const mobile=document.getElementById("editMobile").value.trim();
  const newEmail=document.getElementById("editEmail").value.trim();
  const newPassword=document.getElementById("editPassword").value;

  if(!full_name || !username || !mobile || !newEmail){
    showMessage("profileMessage","Please complete all required fields.",true);
    button.disabled=false;
    button.textContent="Save Profile Changes";
    return;
  }

  if(newPassword && newPassword.length<6){
    showMessage("profileMessage","Password must be at least 6 characters.",true);
    button.disabled=false;
    button.textContent="Save Profile Changes";
    return;
  }

  try{
    const authChanges={};

    if(newEmail!==currentUser.email) authChanges.email=newEmail;
    if(newPassword) authChanges.password=newPassword;

    if(Object.keys(authChanges).length){
      const {data,error}=await db.auth.updateUser(authChanges);
      if(error) throw error;
      if(data?.user) currentUser=data.user;
    }

    const {error:profileError}=await db
      .from("hut8_profiles")
      .update({full_name,username,mobile})
      .eq("id",currentUser.id);

    if(profileError) throw profileError;

    await loadProfile();
    showProfile();

    const msg=newEmail!==currentUser.email
      ? "Profile saved. Check your email if Supabase requests email confirmation."
      : "Your profile has been updated successfully.";

    showMessage("profileMessage",msg);

  }catch(error){
    console.error("Profile update error:",error);
    showMessage("profileMessage",error.message || "Could not update your profile.",true);
  }finally{
    const b=document.getElementById("saveProfileButton");
    if(b){
      b.disabled=false;
      b.textContent="Save Profile Changes";
    }
  }
}

async function showEarnings(){
  document.getElementById("pageTitle").textContent="My Earnings";
  content.innerHTML=`<div class="panel"><h3>My Earnings</h3><p class="empty">Loading records...</p></div>`;

  const {data,error}=await db
    .from("hut8_earnings")
    .select("*")
    .eq("user_id",currentUser.id)
    .order("created_at",{ascending:false});

  if(error){
    content.innerHTML=`<div class="panel"><h3>My Earnings</h3><p class="empty">${esc(error.message)}</p></div>`;
    return;
  }

  let rows=(data || []).map(item=>`
    <tr>
      <td>${esc(item.description || "Earning record")}</td>
      <td>${money(item.amount)}</td>
      <td>${esc(item.status || "—")}</td>
      <td>${item.created_at ? new Date(item.created_at).toLocaleDateString() : "—"}</td>
    </tr>`).join("");

  content.innerHTML=`
    <div class="panel">
      <h3>My Earnings</h3>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Description</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead>
          <tbody>${rows || `<tr><td colspan="4" class="empty">No earnings records found.</td></tr>`}</tbody>
        </table>
      </div>
    </div>`;
}

async function showTransactions(){
  document.getElementById("pageTitle").textContent="Transactions";
  content.innerHTML=`<div class="panel"><h3>Transactions</h3><p class="empty">Loading records...</p></div>`;

  const {data,error}=await db
    .from("hut8_transactions")
    .select("*")
    .eq("user_id",currentUser.id)
    .order("created_at",{ascending:false});

  if(error){
    content.innerHTML=`<div class="panel"><h3>Transactions</h3><p class="empty">${esc(error.message)}</p></div>`;
    return;
  }

  const rows=(data || []).map(t=>`
    <tr>
      <td>${esc(t.transaction_type || "—")}</td>
      <td>${esc(t.direction || "—")}</td>
      <td>${money(t.amount)}</td>
      <td>${esc(t.status || "—")}</td>
      <td>${t.created_at ? new Date(t.created_at).toLocaleDateString() : "—"}</td>
    </tr>`).join("");

  content.innerHTML=`
    <div class="panel">
      <h3>Transaction History</h3>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Type</th><th>Direction</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead>
          <tbody>${rows || `<tr><td colspan="5" class="empty">No transactions found.</td></tr>`}</tbody>
        </table>
      </div>
    </div>`;
}

async function showReferrals(){
  document.getElementById("pageTitle").textContent="Referrals";
  content.innerHTML=`<div class="panel"><h3>My Referrals</h3><p class="empty">Loading records...</p></div>`;

  const {data,error}=await db
    .from("hut8_referrals")
    .select("*")
    .eq("referrer_id",currentUser.id)
    .order("created_at",{ascending:false});

  if(error){
    content.innerHTML=`<div class="panel"><h3>My Referrals</h3><p class="empty">${esc(error.message)}</p></div>`;
    return;
  }

  const code=profile?.referral_code || "";
  const rows=(data || []).map(r=>`
    <tr>
      <td>${esc(r.referral_code || code || "—")}</td>
      <td>${esc(r.status || "—")}</td>
      <td>${money(r.reward_amount)}</td>
      <td>${r.created_at ? new Date(r.created_at).toLocaleDateString() : "—"}</td>
    </tr>`).join("");

  content.innerHTML=`
    <div class="panel">
      <h3>Your Referral Code</h3>
      <div class="record"><p>${esc(code || "No referral code available")}</p></div>
      <button class="primary" style="margin-top:12px" onclick="copyReferralCode()">Copy Referral Code</button>
      <p class="message" id="referralMessage"></p>
    </div>
    <div class="panel">
      <h3>Referral Records</h3>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Code</th><th>Status</th><th>Reward</th><th>Date</th></tr></thead>
          <tbody>${rows || `<tr><td colspan="4" class="empty">No referral records found.</td></tr>`}</tbody>
        </table>
      </div>
    </div>`;
}

async function copyReferralCode(){
  const code=profile?.referral_code || "";
  if(!code){
    showMessage("referralMessage","No referral code is available.",true);
    return;
  }

  try{
    await navigator.clipboard.writeText(code);
    showMessage("referralMessage","Referral code copied.");
  }catch(e){
    showMessage("referralMessage","Copy is unavailable on this browser. Please copy: "+code,true);
  }
}

async function logout(){
  await db.auth.signOut();
  window.location.href="index.html";
}

startDashboard();
</script>
</body>
 </html>
