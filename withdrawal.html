<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HUT8 ADVANCED - Withdraw</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
background:#F3FAFF;
color:#12345A;
padding:20px;
}

.container{
max-width:650px;
margin:25px auto;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
}

.header h2{color:#168FCB}

.header button{
background:white;
border:1px solid #DCEFFC;
color:#168FCB;
padding:10px 15px;
border-radius:20px;
font-weight:bold;
}

.card{
background:white;
padding:23px;
border-radius:18px;
border:1px solid #DCEFFC;
box-shadow:0 3px 12px rgba(0,130,190,.08);
margin-bottom:20px;
}

.balance{
background:linear-gradient(110deg,#0876C9,#55C9F0);
color:white;
padding:25px;
border-radius:17px;
margin-bottom:20px;
}

.balance p{font-size:14px;margin-bottom:10px}
.balance h1{font-size:29px}

h3{
color:#168FCB;
margin-bottom:18px;
}

label{
display:block;
font-size:14px;
font-weight:bold;
margin:15px 0 8px;
}

input,select{
width:100%;
padding:14px;
border:1px solid #CDE5F4;
border-radius:10px;
font-size:15px;
outline:none;
background:white;
color:#12345A;
}

input:focus,select:focus{
border-color:#279FD5;
}

.submit{
width:100%;
padding:15px;
background:#279FD5;
color:white;
border:0;
border-radius:30px;
font-size:16px;
font-weight:bold;
margin-top:22px;
cursor:pointer;
}

.submit:disabled{
opacity:.6;
}

.note{
font-size:12px;
color:#7890A5;
margin-top:10px;
line-height:1.5;
}

table{
width:100%;
border-collapse:collapse;
min-width:450px;
}

th,td{
padding:13px 9px;
border-bottom:1px solid #E5F2F9;
text-align:left;
font-size:13px;
}

th{background:#EAF7FF}

.history{
overflow-x:auto;
}

.status{
font-weight:bold;
color:#168FCB;
}

.empty{
text-align:center;
padding:20px;
color:#7890A5;
}

.message{
margin-top:15px;
font-size:14px;
line-height:1.5;
}

@media(max-width:450px){
body{padding:12px}
.card{padding:18px}
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<h2>HUT8 ADVANCED</h2>
<button onclick="location.href='dashboard.html'">← Dashboard</button>
</div>

<div id="loading" class="card">
Loading your account...
</div>

<div id="withdrawPage" style="display:none">

<div class="balance">
<p>Available Balance</p>
<h1 id="balance">UGX 0</h1>
</div>

<div class="card">

<h3>Request Withdrawal</h3>

<form id="withdrawForm">

<label>Withdrawal Amount (UGX)</label>
<input
type="number"
id="amount"
min="5000"
step="1"
placeholder="Enter amount"
required
>

<label>Mobile Money Provider</label>
<select id="paymentMethod" required>
<option value="">Select provider</option>
<option value="MTN Mobile Money">MTN Mobile Money</option>
<option value="Airtel Money">Airtel Money</option>
</select>

<label>Mobile Money Account Name</label>
<input
type="text"
id="accountName"
placeholder="Enter account name"
required
>

<label>Mobile Money Number</label>
<input
type="tel"
id="accountNumber"
placeholder="Enter mobile money number"
required
>

<p class="note">
Minimum withdrawal: UGX 5,000. Requests are subject to administrator review. Approval does not automatically send mobile money.
</p>

<button type="submit" class="submit" id="submitButton">
Submit Withdrawal Request
</button>

<div class="message" id="message"></div>

</form>
</div>

<div class="card">
<h3>Withdrawal History</h3>

<div class="history">
<table>
<thead>
<tr>
<th>Date</th>
<th>Amount</th>
<th>Provider</th>
<th>Status</th>
</tr>
</thead>

<tbody id="history">
<tr><td colspan="4" class="empty">Loading history...</td></tr>
</tbody>
</table>
</div>

</div>

</div>
</div>

<script>
const SUPABASE_URL =
"https://chjtxxwxhvjwpspmikme.supabase.co";

const SUPABASE_KEY =
"sb_publishable_g8m0qRrMveb8A7H3BLYYg_g21-SBKA";

const supabaseClient = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let currentUser = null;
let availableBalance = 0;

function money(value){
return "UGX " + Number(value || 0).toLocaleString("en-US");
}

async function loadPage(){

try{

const {data,error} =
await supabaseClient.auth.getSession();

if(error) throw error;

if(!data.session){
location.replace("index.html");
return;
}

currentUser = data.session.user;

const {data:profile,error:profileError} =
await supabaseClient
.from("hut8_profiles")
.select("balance")
.eq("id",currentUser.id)
.single();

if(profileError) throw profileError;

availableBalance = Number(profile.balance || 0);

document.getElementById("balance").textContent =
money(availableBalance);

document.getElementById("loading").style.display="none";
document.getElementById("withdrawPage").style.display="block";

await loadHistory();

}catch(error){

document.getElementById("loading").textContent =
"Unable to load account: " + error.message;

}

}

async function loadHistory(){

const {data,error} = await supabaseClient
.from("hut8_withdrawals")
.select("amount,payment_method,status,created_at")
.eq("user_id",currentUser.id)
.order("created_at",{ascending:false});

if(error) throw error;

const tbody = document.getElementById("history");

if(!data || data.length===0){

tbody.innerHTML =
'<tr><td colspan="4" class="empty">No withdrawal requests yet.</td></tr>';

return;
}

tbody.innerHTML = "";

data.forEach(item=>{

const row = document.createElement("tr");

const date = new Date(item.created_at)
.toLocaleDateString();

const values = [
date,
money(item.amount),
item.payment_method,
item.status.toUpperCase()
];

values.forEach(value=>{
const cell = document.createElement("td");
cell.textContent = value;
row.appendChild(cell);
});

tbody.appendChild(row);

});

}

document.getElementById("withdrawForm")
.addEventListener("submit",async function(event){

event.preventDefault();

const amount = Number(
document.getElementById("amount").value
);

const paymentMethod =
document.getElementById("paymentMethod").value;

const accountName =
document.getElementById("accountName").value.trim();

const accountNumber =
document.getElementById("accountNumber").value.trim();

const message = document.getElementById("message");
const button = document.getElementById("submitButton");

message.textContent = "";

if(amount < 5000){
message.textContent =
"Minimum withdrawal is UGX 5,000.";
return;
}

if(amount > availableBalance){
message.textContent =
"Your available balance is insufficient.";
return;
}

if(!paymentMethod || !accountName || !accountNumber){
message.textContent =
"Please complete all the fields.";
return;
}

button.disabled = true;
button.textContent = "Submitting...";

try{

const {error} = await supabaseClient
.from("hut8_withdrawals")
.insert({
user_id:currentUser.id,
amount:amount,
payment_method:paymentMethod,
account_name:accountName,
account_number:accountNumber,
status:"pending"
});

if(error) throw error;

message.style.color = "#168FCB";
message.textContent =
"Withdrawal request submitted successfully. It is now pending administrator review.";

document.getElementById("withdrawForm").reset();

await loadHistory();

}catch(error){

message.style.color = "#D33";
message.textContent =
"Request failed: " + error.message;

}finally{

button.disabled = false;
button.textContent = "Submit Withdrawal Request";

}

});

supabaseClient.auth.onAuthStateChange((event,session)=>{

if(event==="SIGNED_OUT"){
location.replace("index.html");
}

});

loadPage();
</script>

</body>
  </html>
