
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HUT8 ADVANCED Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f3faff;color:#12345a}
button{cursor:pointer;font-family:inherit}
.layout{display:flex;min-height:100vh}
.sidebar{width:235px;background:#279fd5;color:white;padding:25px 15px;position:fixed;inset:0 auto 0 0;overflow-y:auto}
.logo{font-size:23px;font-weight:800;margin-bottom:8px}
.sublogo{font-size:12px;margin-bottom:30px;opacity:.85}
.nav button{display:block;width:100%;text-align:left;padding:14px;margin:5px 0;border:0;border-radius:9px;background:transparent;color:white;font-size:15px}
.nav button:hover,.nav button.active{background:#ffffff30}
.main{margin-left:235px;width:calc(100% - 235px);padding:25px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:25px}
.top h2{font-size:23px}
.logout{background:#12345a;color:white;border:0;border-radius:8px;padding:11px 17px}
.welcome{background:linear-gradient(120deg,#279fd5,#65c5ed);padding:25px;border-radius:17px;color:white;margin-bottom:20px}
.welcome h2{font-size:23px;margin-bottom:8px}
.welcome p{opacity:.9}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;margin-bottom:22px}
.card{background:white;padding:20px;border-radius:14px;box-shadow:0 3px 14px #12345a0c}
.card small{color:#6c8298}
.card h2{font-size:23px;margin-top:10px;color:#12345a;overflow-wrap:anywhere}
.section-title{font-size:19px;margin:22px 0 13px}
.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.action{background:white;border:1px solid #e2f0f8;padding:19px;border-radius:13px;text-align:left;color:#12345a}
.action strong{display:block;font-size:16px;margin-bottom:7px}
.action span{font-size:12px;color:#71869b}
.action:hover{border-color:#279fd5}
.content-panel{background:white;border-radius:14px;padding:18px;margin:15px 0;overflow-wrap:anywhere}
.record{padding:15px;border:1px solid #e6f0f6;border-radius:11px;margin:12px 0}
.record strong{font-size:17px}
.record p{margin-top:7px;font-size:14px;color:#526b82}
.status{display:inline-block;padding:5px 9px;border-radius:20px;background:#e8f5fc;font-size:12px;margin-top:8px}
.back{background:#279fd5;color:white;border:0;padding:11px 17px;border-radius:8px;margin-bottom:15px}
.copy{background:#279fd5;color:white;border:0;padding:12px 16px;border-radius:8px;margin:8px 5px 8px 0}
.share{background:#12345a;color:white;border:0;padding:12px 16px;border-radius:8px}
.empty{padding:22px;text-align:center;color:#71869b}
.mobile-nav{display:none}
.loading{text-align:center;padding:35px}
.error{color:#b42318;padding:12px}
@media(max-width:800px){
 .sidebar{display:none}
 .main{margin-left:0;width:100%;padding:17px 14px 90px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .card{padding:15px}
 .card h2{font-size:19px}
 .actions{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
 .action{padding:15px}
 .top h2{font-size:19px}
 .mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:white;box-shadow:0 -3px 15px #12345a18;z-index:1000;justify-content:space-around;padding:9px 3px}
 .mobile-nav button{background:none;border:0;color:#12345a;font-size:11px;padding:6px 3px}
 .mobile-nav button span{display:block;font-size:18px;margin-bottom:3px}
}
</style>
</head>

<body>
<div id="app">
  <div class="loading">Connecting to HUT8 ADVANCED...</div>
</div>

<script>
const SUPABASE_URL = "https://chjtxxwxhvjwpspmikme.supabase.co";
const SUPABASE_KEY = "sb_publishable_g8m0qRrMveb8A7H3BLYYg_g21-SBKA";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let profile = null;

const app = document.getElementById("app");

function money(value){
  return Number(value || 0).toLocaleString();
}

function esc(value){
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function dateText(value){
  if(!value) return "Date unavailable";
  const d = new Date(value);
  return isNaN(d) ? esc(value) : d.toLocaleString();
}

async function startDashboard(){
  const {data,error} = await db.auth.getSession();

  if(error || !data.session){
    app.innerHTML = `
      <div class="loading">
        <h2>Please log in</h2>
        <p>Your HUT8 session is not active.</p>
        <br><a href="index.html">Go to login</a>
      </div>`;
    return;
  }

  currentUser = data.session.user;

  await loadProfile();
  renderDashboard();
  await refreshSummary();
}

async function loadProfile(){
  const {data,error} = await db
    .from("hut8_profiles")
    .select("id,full_name,username,mobile,email,balance,referral_code,referred_by")
    .eq("id",currentUser.id)
    .maybeSingle();

  if(error){
    console.error("Profile error:",error.message);
  }

  profile = data || {
    id:currentUser.id,
    full_name:currentUser.user_metadata?.full_name || "",
    username:currentUser.user_metadata?.username || "",
    email:currentUser.email || "",
    balance:0
  };
}

function renderDashboard(){
  const name = profile.full_name || profile.username || currentUser.email;

  app.innerHTML = `
  <div class="layout">
    <aside class="sidebar">
      <div class="logo">HUT8 ADVANCED</div>
      <div class="sublogo">Your account dashboard</div>
      <div class="nav">
        <button class="active" data-page="home">⌂ &nbsp; Home</button>
        <button data-page="deposit">＋ &nbsp; Deposit</button>
        <button data-page="withdraw">↗ &nbsp; Withdraw</button>
        <button data-page="plans">▦ &nbsp; Investment Plans</button>
        <button data-page="earnings">◈ &nbsp; My Earnings</button>
        <button data-page="transactions">▤ &nbsp; Transactions</button>
        <button data-page="referrals">♧ &nbsp; Referrals</button>
        <button data-page="profile">◎ &nbsp; My Profile</button>
        <button data-page="logout">⇥ &nbsp; Logout</button>
      </div>
    </aside>

    <main class="main">
      <div class="top">
        <h2>Dashboard</h2>
        <button class="logout" data-page="logout">Logout</button>
      </div>

      <section id="pageContent">
        <div class="welcome">
          <h2>Welcome, ${esc(name)}</h2>
          <p>Manage your HUT8 ADVANCED account.</p>
        </div>

        <div class="grid">
          <div class="card">
            <small>Account Balance</small>
            <h2 id="balanceValue">Loading...</h2>
          </div>
          <div class="card">
            <small>Total Deposited</small>
            <h2 id="depositValue">Loading...</h2>
          </div>
          <div class="card">
            <small>Total Withdrawn</small>
            <h2 id="withdrawValue">Loading...</h2>
          </div>
          <div class="card">
            <small>Recorded Earnings</small>
            <h2 id="earningValue">Loading...</h2>
          </div>
          <div class="card">
            <small>Account Name</small>
            <h2 style="font-size:16px">${esc(name)}</h2>
          </div>
          <div class="card">
            <small>Account Status</small>
            <h2 style="font-size:17px">Registered</h2>
          </div>
        </div>

        <h3 class="section-title">Your account services</h3>
        <div class="actions">
          <button class="action" data-page="deposit"><strong>＋ Deposit</strong><span>Submit a deposit request</span></button>
          <button class="action" data-page="withdraw"><strong>↗ Withdraw</strong><span>Submit a withdrawal request</span></button>
          <button class="action" data-page="plans"><strong>▦ Investment Plans</strong><span>Explore available plans</span></button>
          <button class="action" data-page="earnings"><strong>◈ My Earnings</strong><span>View recorded earnings</span></button>
          <button class="action" data-page="transactions"><strong>▤ Transactions</strong><span>View account transactions</span></button>
          <button class="action" data-page="referrals"><strong>♧ Referrals</strong><span>View and share your referral link</span></button>
          <button class="action" data-page="profile"><strong>◎ My Profile</strong><span>View your account information</span></button>
        </div>
      </section>
    </main>
  </div>

  <nav class="mobile-nav">
    <button data-page="home"><span>⌂</span>Home</button>
    <button data-page="deposit"><span>＋</span>Deposit</button>
    <button data-page="withdraw"><span>↗</span>Withdraw</button>
    <button data-page="plans"><span>▦</span>Plans</button>
    <button data-page="profile"><span>◎</span>Profile</button>
  </nav>
  </div>`;

  document.querySelectorAll("[data-page]").forEach(button=>{
    button.addEventListener("click",()=>{
      openPage(button.dataset.page);
    });
  });
}

async function refreshSummary(){
  const balance = Number(profile.balance || 0);

  const {data,error} = await db
    .from("hut8_transactions")
    .select("transaction_type,direction,amount,status")
    .eq("user_id",currentUser.id);

  if(error){
    console.error("Summary transaction error:",error.message);
    setText("balanceValue",money(balance));
    setText("depositValue","—");
    setText("withdrawValue","—");
    setText("earningValue","—");
    return;
  }

  let deposits=0,withdrawals=0,earnings=0;

  (data || []).forEach(row=>{
    if(row.status !== "completed") return;
    const amount = Number(row.amount || 0);
    const type = String(row.transaction_type || "").toLowerCase();

    if(type === "deposit" && row.direction === "credit") deposits += amount;
    if(type === "withdrawal" && row.direction === "debit") withdrawals += amount;
    if(type === "earning" && row.direction === "credit") earnings += amount;
  });

  setText("balanceValue",money(balance));
  setText("depositValue",money(deposits));
  setText("withdrawValue",money(withdrawals));
  setText("earningValue",money(earnings));
}

function setText(id,value){
  const element=document.getElementById(id);
  if(element) element.textContent=value;
}

function openPage(page){
  if(page==="home"){
    location.href="dashboard.html";
    return;
  }
  if(page==="deposit"){
    location.href="deposit.html";
    return;
  }
  if(page==="withdraw"){
    location.href="withdraw.html";
    return;
  }
  if(page==="plans"){
    location.href="plans.html";
    return;
  }
  if(page==="logout"){
    logout();
    return;
  }
  if(page==="earnings") showEarnings();
  if(page==="transactions") showTransactions();
  if(page==="referrals") showReferrals();
  if(page==="profile") showProfile();
}

function panel(title,html){
  const content=document.getElementById("pageContent");
  content.innerHTML=`
    <button class="back" onclick="goHome()">← Back to Dashboard</button>
    <h2 style="margin:10px 0 18px">${esc(title)}</h2>
    ${html}`;
}

function goHome(){
  renderDashboard();
  refreshSummary();
}

async function showEarnings(){
  panel("My Earnings",'<div class="loading">Loading your earnings...</div>');

  const {data,error}=await db
    .from("hut8_earnings")
    .select("*")
    .eq("user_id",currentUser.id)
    .order("created_at",{ascending:false});

  if(error){
    panel("My Earnings",`<p class="error">Unable to load earnings: ${esc(error.message)}</p>`);
    return;
  }

  let html="";
  if(!data?.length) html='<div class="empty">No earnings records found.</div>';

  (data || []).forEach(r=>{
    html+=`
      <div class="record">
        <strong>${money(r.amount)}</strong>
        <p>${esc(r.description || "Earnings record")}</p>
        <p>Date: ${dateText(r.earning_date || r.created_at)}</p>
        <span class="status">${esc(r.status)}</span>
      </div>`;
  });

  panel("My Earnings",html);
}

async function showTransactions(){
  panel("Transactions",'<div class="loading">Loading your transactions...</div>');

  const {data,error}=await db
    .from("hut8_transactions")
    .select("transaction_type,direction,amount,reference,description,status,created_at")
    .eq("user_id",currentUser.id)
    .order("created_at",{ascending:false});

  if(error){
    panel("Transactions",`<p class="error">Unable to load transactions: ${esc(error.message)}</p>`);
    return;
  }

  let html="";
  if(!data?.length) html='<div class="empty">No transactions recorded yet.</div>';

  (data || []).forEach(r=>{
    html+=`
      <div class="record">
        <strong>${money(r.amount)}</strong>
        <p>Type: ${esc(r.transaction_type)}</p>
        <p>Direction: ${esc(r.direction)}</p>
        <p>Status: ${esc(r.status)}</p>
        <p>Reference: ${esc(r.reference || "—")}</p>
        <p>${esc(r.description || "")}</p>
        <small>${dateText(r.created_at)}</small>
      </div>`;
  });

  panel("Transactions",html);
}

async function showReferrals(){
  panel("Referrals",'<div class="loading">Loading your referrals...</div>');

  const {data:refProfile,error:profileError}=await db
    .from("hut8_profiles")
    .select("referral_code")
    .eq("id",currentUser.id)
    .maybeSingle();

  if(profileError){
    panel("Referrals",`<p class="error">${esc(profileError.message)}</p>`);
    return;
  }

  const code=refProfile?.referral_code || "";
  const link=new URL("index.html",location.href);
  if(code) link.searchParams.set("ref",code);

  const {data,error}=await db
    .from("hut8_referrals")
    .select("referral_code,status,reward_amount,created_at,verified_at")
    .eq("referrer_id",currentUser.id)
    .order("created_at",{ascending:false});

  if(error){
    panel("Referrals",`<p class="error">Unable to load referrals: ${esc(error.message)}</p>`);
    return;
  }

  let html=`
    <div class="content-panel">
      <h3>Your referral link</h3>
      <p style="overflow-wrap:anywhere;margin:12px 0" id="referralLink">${esc(link.href)}</p>
      <button class="copy" id="copyReferral">Copy Link</button>
      <button class="share" id="shareReferral">Share Link</button>
      ${!code ? '<p class="error">Your account does not have a referral code yet.</p>' : ''}
    </div>
    <h3 class="section-title">Referral Records</h3>`;

  if(!data?.length) html+='<div class="empty">No referrals recorded yet.</div>';

  (data || []).forEach(r=>{
    html+=`
      <div class="record">
        <strong>Reward: ${money(r.reward_amount)}</strong>
        <p>Code: ${esc(r.referral_code)}</p>
        <p>Status: ${esc(r.status)}</p>
        <small>${dateText(r.created_at)}</small>
      </div>`;
  });

  panel("Referrals",html);

  document.getElementById("copyReferral").onclick=async()=>{
    try{
      if(navigator.clipboard && window.isSecureContext){
        await navigator.clipboard.writeText(link.href);
      }else{
        const input=document.createElement("textarea");
        input.value=link.href;
        document.body.appendChild(input);
        input.select();
        const copied=document.execCommand("copy");
        input.remove();
        if(!copied) throw new Error("Copy unavailable");
      }
      alert("Referral link copied.");
    }catch(e){
      prompt("Copy your referral link:",link.href);
    }
  };

  document.getElementById("shareReferral").onclick=async()=>{
    if(navigator.share){
      try{await navigator.share({title:"HUT8 ADVANCED",url:link.href});}
      catch(e){}
    }else{
      prompt("Copy your referral link:",link.href);
    }
  };
}

function showProfile(){
  const p=profile || {};
  panel("My Profile",`
    <div class="content-panel">
      <div class="record"><small>Full Name</small><p>${esc(p.full_name || "Not provided")}</p></div>
      <div class="record"><small>Username</small><p>${esc(p.username || "Not provided")}</p></div>
      <div class="record"><small>Email</small><p>${esc(p.email || currentUser.email || "Not provided")}</p></div>
      <div class="record"><small>Mobile</small><p>${esc(p.mobile || "Not provided")}</p></div>
      <div class="record"><small>Referral Code</small><p>${esc(p.referral_code || "Not available")}</p></div>
      <div class="record"><small>Account Balance</small><p>${money(p.balance)}</p></div>
    </div>`);
}

async function logout(){
  if(!confirm("Are you sure you want to log out?")) return;
  const {error}=await db.auth.signOut();
  if(error){
    alert("Could not log out: "+error.message);
    return;
  }
  location.href="index.html";
}

startDashboard();
</script>
</body>
  </html>
