
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HUT8 ADVANCED | Deposit</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f3faff;
 color:#12345a;
}
header{
 background:#279fd5;
 color:white;
 padding:22px;
 text-align:center;
 font-size:21px;
 font-weight:bold;
}
.container{
 max-width:480px;
 margin:30px auto;
 padding:20px;
}
.card{
 background:white;
 padding:25px;
 border-radius:16px;
 box-shadow:0 5px 22px rgba(0,0,0,.07);
}
h2{text-align:center;margin-top:0}
.payment-code{
 background:#e7f5ff;
 border:2px solid #279fd5;
 border-radius:12px;
 padding:22px;
 text-align:center;
 font-size:30px;
 font-weight:bold;
 letter-spacing:2px;
 margin:20px 0;
 color:#12345a;
}
input{
 width:100%;
 padding:14px;
 margin:9px 0;
 border:1px solid #cbdce8;
 border-radius:9px;
 font-size:15px;
}
button{
 width:100%;
 padding:15px;
 border:0;
 border-radius:9px;
 background:#279fd5;
 color:white;
 font-size:16px;
 font-weight:bold;
 margin-top:15px;
}
button:disabled{opacity:.6}
.message{
 text-align:center;
 margin-top:15px;
 font-size:14px;
}
.back{
 display:block;
 text-align:center;
 margin-top:20px;
 color:#1686bd;
 text-decoration:none;
}
</style>
</head>

<body>

<header>HUT8 ADVANCED</header>

<div class="container">
<div class="card">

<h2>Make a Deposit</h2>

<div class="payment-code">81132529</div>

<form id="depositForm">

<input
 type="number"
 id="amount"
 placeholder="Deposit amount (Minimum UGX 5,000)"
 min="5000"
 step="1"
 required
>

<input
 type="text"
 id="senderName"
 placeholder="Your mobile money name"
 required
>

<input
 type="tel"
 id="senderNumber"
 placeholder="Your mobile money number"
 required
>

<input
 type="text"
 id="reference"
 placeholder="Transaction reference"
 required
>

<button type="submit" id="submitBtn">
Submit Deposit
</button>

</form>

<div class="message" id="message"></div>

<a class="back" href="dashboard.html">Back to Dashboard</a>

</div>
</div>

<script>
const SUPABASE_URL =
"https://chjtxxwxhvjwpspmikme.supabase.co";

const SUPABASE_KEY =
"sb_publishable_g8gM0qRrMveb8A7H3BLYYg_g21-SBKA";

const db = window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

const form = document.getElementById("depositForm");
const message = document.getElementById("message");
const submitBtn = document.getElementById("submitBtn");

form.addEventListener("submit", async function(e){
 e.preventDefault();

 message.textContent = "";

 const amount = Number(
  document.getElementById("amount").value
 );

 const senderName =
  document.getElementById("senderName").value.trim();

 const senderNumber =
  document.getElementById("senderNumber").value.trim();

 const reference =
  document.getElementById("reference").value.trim();

 if(amount < 5000){
  message.textContent =
   "Minimum deposit is UGX 5,000.";
  return;
 }

 submitBtn.disabled = true;
 submitBtn.textContent = "Submitting...";

 try{
  const {data:{session},error:sessionError} =
   await db.auth.getSession();

  if(sessionError) throw sessionError;

  if(!session){
   message.textContent =
    "Please log in before submitting a deposit.";
   return;
  }

  const {error} = await db
   .from("hut8_deposits")
   .insert([{
    user_id: session.user.id,
    amount: amount,
    payment_method: "MTN",
    mobile_money_name: senderName,
    mobile_money_number: senderNumber,
    transaction_reference: reference,
    status: "pending"
   }]);

  if(error) throw error;

  message.textContent =
   "Deposit submitted successfully. Awaiting admin approval.";

  form.reset();

 }catch(error){
  message.textContent =
   "Could not submit deposit: " + error.message;
 }finally{
  submitBtn.disabled = false;
  submitBtn.textContent = "Submit Deposit";
 }
});
</script>

</body>
 </html>
